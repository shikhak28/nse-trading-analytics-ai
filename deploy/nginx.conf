# Reverse proxy + static frontend for the AWS EC2 deployment. Copy to
# /etc/nginx/sites-available/stock-platform, symlink into sites-enabled,
# then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Route prefixes here match backend/server.js's app.use(...) list exactly --
# keep both in sync if a new route module is ever added there.

server {
    listen 80;
    server_name _;

    # Built frontend (run `npm run build` in frontend/ first)
    root /home/ubuntu/stock-platform/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~ ^/(auth|market|agent|portfolio|gtt|orders|predictions|verification|accuracy|model|ranking)(/|$) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # socket.io needs the Upgrade/Connection headers for the websocket
    # handshake -- see backend/realtime/marketSocket.js.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

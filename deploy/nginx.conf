# Reverse proxy + static frontend for the AWS EC2 deployment. Copy to
# /etc/nginx/sites-available/stock-platform, symlink into sites-enabled,
# then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Route prefixes here match backend/server.js's app.use(...) list exactly --
# keep both in sync if a new route module is ever added there.
#
# IMPORTANT: the HTTPS block below bakes in the certbot cert paths directly
# (rather than relying on certbot's `--nginx` plugin to inject them live
# into this file on the server). Earlier, this file only had a plain port-80
# block; certbot added the port-443 block itself directly on the server, and
# a later `cp` of this checked-in file over the live one silently deleted
# that SSL config, breaking HTTPS until certbot was rerun. Keeping the SSL
# block checked in here means a future `cp` can't repeat that mistake --
# if the paths below ever stop matching reality (new domain, cert renamed),
# `sudo certbot --nginx -d stockml.duckdns.org` will fix the live file, and
# this one should then be updated to match.

server {
    listen 80;
    server_name stockml.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name stockml.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/stockml.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockml.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compress text responses -- the JS bundle shrinks ~3x, which matters a
    # lot on the first visit from a slow connection.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Built frontend (run `npm run build` in frontend/ first)
    root /home/ubuntu/stock-platform/frontend/dist;
    index index.html;

    # Vite puts a content hash in every asset filename, so a cached copy can
    # never go stale -- let browsers keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must always be re-checked, or a deploy wouldn't show up.
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~ ^/(auth|market|agent|portfolio|gtt|orders|model|ranking)(/|$) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /predictions, /verification, /accuracy are deliberately NOT in the
    # block above -- those are React Router page routes (see App.jsx) at
    # the exact same bare path as the matching backend API, which lives
    # under /api/* instead (see server.js). Without this split, a hard
    # navigation/refresh on those pages hit the API and got raw JSON
    # instead of the SPA shell.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # socket.io needs the Upgrade/Connection headers for the websocket
    # handshake -- see backend/realtime/marketSocket.js.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
